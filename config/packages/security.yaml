security:
    # Algorithme de hachage des mots de passe.
    # 'auto' choisit bcrypt ou argon2id selon la config PHP — deux algorithmes
    # intentionnellement lents qui rendent le brute force pratiquement impossible.
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: username

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        # Firewall dédié à l'authentification.
        # Reçoit { username, password } en JSON et retourne un token JWT signé.
        # stateless: true = aucune session côté serveur, l'état est uniquement dans le token.
        login:
            pattern: ^/api/batcave
            stateless: true
            json_login:
                check_path: /api/batcave
                username_path: username
                password_path: password
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure

        # Firewall qui protège toutes les routes admin.
        # Chaque requête doit porter un JWT valide dans le header Authorization: Bearer <token>.
        # Le token est vérifié par signature cryptographique RSA — impossible à falsifier
        # sans la clé privée.
        api_admin:
            pattern: ^/api/admin
            stateless: true
            provider: app_user_provider
            jwt: ~

    access_control:
        # /api/batcave est public pour permettre la connexion.
        - { path: ^/api/batcave, roles: PUBLIC_ACCESS }
        # Toutes les routes /api/admin/* requièrent le rôle ROLE_ADMIN.
        # Un utilisateur avec un JWT valide mais sans ROLE_ADMIN reçoit un 403.
        - { path: ^/api/admin, roles: ROLE_ADMIN }
