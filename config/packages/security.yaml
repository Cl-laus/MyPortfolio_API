security:
    # Les mots de passe sont hachés avec bcrypt/argon2 — algorithmes lents par conception,
    # rendant le brute force pratiquement impossible même si la base est volée.
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: username

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        # Firewall de connexion : reçoit { username, password }, retourne un token JWT.
        # stateless = pas de session côté serveur, tout est dans le token.
        login:
            pattern: ^/api/batcave
            stateless: true
            json_login:
                check_path: /api/batcave
                username_path: username
                password_path: password
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure

        # Firewall admin : toutes les routes /api/admin/* nécessitent un JWT valide.
        # Le token est vérifié par signature RSA — impossible à falsifier sans la clé privée.
        api_admin:
            pattern: ^/api/admin
            stateless: true
            provider: app_user_provider
            jwt: ~

    access_control:
        - { path: ^/api/batcave, roles: PUBLIC_ACCESS }  # login public
        - { path: ^/api/admin, roles: ROLE_ADMIN }        # tout le reste = admin uniquement
