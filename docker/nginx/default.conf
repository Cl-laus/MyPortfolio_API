server {
    listen 80;
    root /var/www/html/public;

    index index.php;

    # Dossier des fichiers uploadés : servi comme fichiers statiques uniquement.
    # Cette règle doit être AVANT le bloc PHP ci-dessous.
    # Sans elle, Nginx exécuterait n'importe quel fichier .php déposé dans /uploads/
    # (faille Remote Code Execution). Ici, un .php dans /uploads/ retourne 404.
    location ~ ^/uploads/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.php$is_args$args;
    }

    # Tous les fichiers .php hors /uploads/ sont transmis à PHP-FPM pour exécution.
    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # Limite la taille des requêtes entrantes (utile pour les uploads d'images).
    client_max_body_size 50M;
}
