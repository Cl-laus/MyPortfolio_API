server {
    listen 80;
    root /var/www/html/public;
    index index.php;

    # Toutes les requêtes passent par index.php (point d'entrée Symfony).
    location / {
        try_files $uri /index.php$is_args$args;
    }

    # Les fichiers .php sont exécutés par PHP-FPM (le container "app" sur le port 9000).
    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # Taille max des requêtes (utile pour les uploads d'images).
    client_max_body_size 50M;
}
