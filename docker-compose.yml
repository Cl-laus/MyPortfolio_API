services:

  # Service PHP (ton application Symfony)
  app:
    build: .
    volumes:
      - .:/var/www/html
      - uploads_data:/var/www/html/public/uploads
    environment:
      APP_ENV: dev
      DATABASE_URL: mysql://${MYSQL_USER:-dev}:${MYSQL_PASSWORD:-mdpdev}@database:3306/${MYSQL_DATABASE:-portfolio_db}?serverVersion=8.0
      MONGODB_URL: mongodb://mongodb:27017
    depends_on:
      - database
      - mongodb


  # Serveur web Nginx
  web:
    image: nginx:alpine
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
      - uploads_data:/var/www/html/public/uploads
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app


  # Base de données MongoDB — stocke les statistiques de visites
  mongodb:
    image: mongo:7
    volumes:
      - mongo_data:/data/db


  # Base de données MySQL
  database:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-portfolio_db}
      MYSQL_USER: ${MYSQL_USER:-dev}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-mdpdev}
    volumes:
      - db_data:/var/lib/mysql
    command: >
      --default-authentication-plugin=mysql_native_password
      --innodb-buffer-pool-size=128M
      --innodb-log-file-size=32M
      --max-connections=50
      --performance-schema=OFF
    mem_limit: ${MYSQL_MEM_LIMIT:-512m}


volumes:
  db_data:
  uploads_data:
  mongo_data:
